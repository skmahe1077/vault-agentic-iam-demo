apiVersion: v1
kind: Namespace
metadata:
  name: prod-checkout
---
apiVersion: v1
kind: Namespace
metadata:
  name: prod-billing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: prod-checkout
  labels:
    app: checkout-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
    spec:
      containers:
        - name: checkout-service
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: prod-billing
  labels:
    app: billing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
        - name: billing-service
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
