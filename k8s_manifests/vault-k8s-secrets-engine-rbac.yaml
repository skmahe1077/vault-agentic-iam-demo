# RBAC for Vault's own connection into the cluster (configured as
# service_account_jwt in `vault write kubernetes/config`). This is Vault's
# standing credential for managing the K8s API -- not part of the
# ephemeral story itself, just the plumbing that lets Vault dynamically
# create/bind/delete the short-lived ServiceAccounts it hands out per
# request. Rules verbatim from HashiCorp's own tutorial:
# https://github.com/hashicorp-education/learn-vault-kubernetes (secrets-engine/roles.yaml, bindings.yaml)
apiVersion: v1
kind: Namespace
metadata:
  name: vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-secrets-abilities
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-secrets-abilities-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-secrets-abilities
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
---
# Kubernetes RBAC's privilege-escalation check blocks creating a
# RoleBinding to a Role whose permissions you don't already hold, unless
# you hold the `bind` verb on that specific Role. Rather than mirror
# checkout-restart-role/billing-restart-role's permissions onto Vault's own
# ClusterRole (which would give Vault's standing credential the very
# deployment-patch rights it's only supposed to delegate per-request),
# grant Vault `bind` scoped to exactly those two Role objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-can-bind-checkout-restart-role
  namespace: prod-checkout
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    resourceNames: ["checkout-restart-role"]
    verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-can-bind-checkout-restart-role
  namespace: prod-checkout
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-can-bind-checkout-restart-role
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-can-bind-billing-restart-role
  namespace: prod-billing
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    resourceNames: ["billing-restart-role"]
    verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-can-bind-billing-restart-role
  namespace: prod-billing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-can-bind-billing-restart-role
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
