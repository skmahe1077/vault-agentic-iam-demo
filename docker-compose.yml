services:
  # No Vault service here -- this demo targets HCP Vault Dedicated
  # exclusively (Agent Registry already provisioned there; HCP manages
  # licensing/entitlement itself). See "Running against HCP Vault
  # Dedicated" in README.md for VAULT_ADDR/VAULT_NAMESPACE/vault login.
  orders-db:
    image: postgres:16-alpine
    container_name: orders-db
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders_admin
      POSTGRES_PASSWORD: ${ORDERS_DB_ADMIN_PASSWORD:-changeme-local-only}
    ports:
      - "5433:5432"
    volumes:
      - ./docker-compose/orders-db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_admin -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10
